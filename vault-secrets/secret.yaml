# kind: Secret
# apiVersion: v1
# metadata:
#   name: app-crds
#   annotations:
#     avp.kubernetes.io/path: "credentials/data/app/nk-vault-test"
# type: Opaque
# stringData:
#   apikey: <apikey>
#   username: <username>
#   password: <password>
  apiVersion: v1
  kind: Secret
  metadata:
    name: argocd-vault-plugin-credentials
    namespace: argocd
  type: Opaque
  stringData:
    VAULT_ADDR: "http://vault-app.vault.svc.cluster.local:8200"
    AVP_TYPE: "vault"
    AVP_AUTH_TYPE: "token"
    VAULT_TOKEN: "<root-token>"   # from vault-unseal-keys secret
  envFrom:
    - secretRef:
        name: argocd-vault-plugin-credentials
